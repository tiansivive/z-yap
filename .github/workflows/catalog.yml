name: Build indexes

on:
  push:
    branches: [main]
    paths:
      - "zettels/**"
      - "connections.md"
      - "thread.md"
      - "scripts/**"

  workflow_dispatch:

jobs:
  build-indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate catalog
        run: python3 scripts/catalog.py --markdown --compact > dist/CATALOG.md

      - name: Generate thread status
        run: node scripts/status.js --markdown > dist/STATUS.md

      - name: Generate thread details
        run: node scripts/threads.js --markdown > dist/THREADS.md

      - name: Generate queue
        run: node scripts/queue.js --markdown > dist/QUEUE.md

      - name: Generate glossary
        run: node scripts/glossary.js --markdown > dist/GLOSSARY.md

      - name: Commit dist/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "chore: regenerate dist/ indexes" && git push
