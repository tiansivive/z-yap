name: z-yap
description: Yap language design space zettelkasten
schema_version: 1

project:
  name: yap
  repo: tiansivive/yap
  path: .
  branch: main

federation:
  hub: z-loom
  namespace: yap
  uri_scheme: "loom://@yap/{zettel_id}"

backend:
  current: github
  github_repo: tiansivive/z-yap
  neo4j_endpoint: null

entry_points:
  readme: README.md
  registry: REGISTRY.md
  paper_trail: thread.md
  agent_init: init.md

zettels:
  path: "zettels/{id}.md"
  format: markdown
  frontmatter:
    required: [tags]
    optional: [refs]

connections:
  path: connections.md
  format: pseudo-cypher

scripts:
  catalog: scripts/catalog.js
  glossary: scripts/glossary.js
  queue: scripts/queue.js
  status: scripts/status.js
  threads: scripts/threads.js
  neighborhood: scripts/neighborhood.js
  tech-debt: scripts/tech-debt.js
  backlog: scripts/backlog.js
  bugs: scripts/bugs.js

dist:
  path: dist/
  files:
    catalog: CATALOG.md
    status: STATUS.md
    threads: THREADS.md
    queue: QUEUE.md
    glossary: GLOSSARY.md
