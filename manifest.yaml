name: z-yap
description: Yap language design space zettelkasten
schema_version: 1

project:
  name: yap
  repo: tiansivive/yap
  path: .
  branch: main

federation:
  hub: z-loom
  namespace: yap
  uri_scheme: "loom://@yap/{zettel_id}"

backend:
  current: github
  github_repo: tiansivive/z-yap
  neo4j_endpoint: null

entry_points:
  readme: README.md
  vocabulary: VOCABULARY.md
  paper_trail: thread.md
  agent_init: init.md

zettels:
  path: "zettels/{id}.md"
  format: markdown
  frontmatter:
    required: [tags]
    optional: [refs]

connections:
  path: connections.md
  format: pseudo-cypher

scripts:
  catalog: scripts/catalog.py

dist:
  path: dist/
  files:
    catalog: CATALOG.md
    status: STATUS.md
    threads: THREADS.md
    queue: QUEUE.md
    glossary: GLOSSARY.md
